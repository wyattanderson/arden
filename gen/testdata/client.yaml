version: 1

schema:
  origin: ipa-oidc-idp v1
  oidBases:
    attributes: "1.3.6.1.4.1.66553.1.1"
    objectClasses: "1.3.6.1.4.1.66553.1.2"
  external:
    attributes:
      ipaUniqueID:
        syntax: directoryString
        singleValue: false
      description:
        syntax: directoryString
        singleValue: false
      distinguishedName:
        syntax: dn
        singleValue: false
    objectClasses: [top]

  attributes:
    ipaOidcIdpClientId:
      oid: 2
      description: "OAuth client identifier"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: true

    ipaOidcIdpDisplayName:
      oid: 3
      description: "Operator-facing display name"
      syntax: "directoryString"
      equality: "caseIgnoreMatch"
      substr: "caseIgnoreSubstringsMatch"
      singleValue: true

    ipaOidcIdpRedirectUri:
      oid: 4
      description: "Exact OAuth redirect URI"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpPostLogoutRedirectUri:
      oid: 5
      description: "Exact post-logout redirect URI"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpAllowedScope:
      oid: 6
      description: "OAuth scope allowed for a client, policy, or grant"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpGrantType:
      oid: 7
      description: "OAuth grant type allowed for a client"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpResponseType:
      oid: 8
      description: "OAuth response type allowed for a client"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpTokenEndpointAuthMethod:
      oid: 9
      description: "OAuth token endpoint authentication method"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: true

    ipaOidcIdpSecretDigest:
      oid: 10
      description: "One-way verifier for an OAuth client secret"
      syntax: "octetString"
      equality: "octetStringMatch"
      singleValue: true

    ipaOidcIdpEnabled:
      oid: 11
      description: "Whether an ipa-oidc-idp object is enabled"
      syntax: "boolean"
      equality: "booleanMatch"
      singleValue: true

    ipaOidcIdpPolicyDn:
      oid: 12
      description: "Applicable ipa-oidc-idp policy DN"
      sup: "distinguishedName"
      syntax: "dn"
      equality: "distinguishedNameMatch"
      singleValue: false

    ipaOidcIdpRequirePkce:
      oid: 13
      description: "Whether PKCE is required"
      syntax: "boolean"
      equality: "booleanMatch"
      singleValue: true

    ipaOidcIdpRequireConsent:
      oid: 14
      description: "Whether interactive consent is required"
      syntax: "boolean"
      equality: "booleanMatch"
      singleValue: true

    ipaOidcIdpRequiredAcr:
      oid: 15
      description: "Required OIDC authentication context class reference"
      syntax: "directoryString"
      equality: "caseExactMatch"
      singleValue: false

    ipaOidcIdpMaxAuthAge:
      oid: 16
      description: "Maximum authentication age in seconds"
      syntax: "integer"
      equality: "integerMatch"
      ordering: "integerOrderingMatch"
      singleValue: true

  objectClasses:
    ipaOidcIdpClient:
      oid: 2
      description: "OAuth client registration"
      sup: ["top"]
      kind: "structural"
      must: ["ipaUniqueID", "ipaOidcIdpClientId", "ipaOidcIdpEnabled"]
      may: ["description", "ipaOidcIdpDisplayName", "ipaOidcIdpRedirectUri", "ipaOidcIdpPostLogoutRedirectUri", "ipaOidcIdpAllowedScope", "ipaOidcIdpGrantType", "ipaOidcIdpResponseType", "ipaOidcIdpTokenEndpointAuthMethod", "ipaOidcIdpSecretDigest", "ipaOidcIdpPolicyDn", "ipaOidcIdpRequirePkce", "ipaOidcIdpRequireConsent", "ipaOidcIdpRequiredAcr", "ipaOidcIdpMaxAuthAge"]

models:
  - name: Client
    package: clientmodel
    attributePrefix: ipaOidcIdp
    objectClasses: [ipaOidcIdpClient]
    scope: children
    validate: validateClient
    namingAttribute: ipaUniqueID
    overrides:
      ipaUniqueID:
        name: UniqueID
        read: requiredOne
      ipaOidcIdpClientId:
        name: ClientID
      description:
        name: Description
        read: optionalOne
      ipaOidcIdpRedirectUri:
        name: RedirectURIs
      ipaOidcIdpPostLogoutRedirectUri:
        name: PostLogoutRedirectURIs
      ipaOidcIdpPolicyDn:
        name: PolicyDNs
        type: string
      ipaOidcIdpRequirePkce:
        name: RequirePKCE
      ipaOidcIdpRequiredAcr:
        name: RequiredACRs
      ipaOidcIdpMaxAuthAge:
        name: MaxAuthenticationAgeSeconds
        type: uint64
    indexes:
      equality: [ipaOidcIdpClientId]
