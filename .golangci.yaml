version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gocritic
    - modernize
    - noctx
    - perfsprint
    - prealloc
    - revive
    - testifylint
  settings:
    depguard:
      rules:
        production:
          files:
            - "!$test"
          deny:
            - pkg: "reflect$"
              desc: "Avoid reflection in production code for performance; use typed operations or a justified import-line nolint:depguard exception."
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
