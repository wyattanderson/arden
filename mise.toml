[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["go"]

[tasks.fmt]
description = "Format Go source"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run Go linters"
run = "golangci-lint run"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tools]
golangci-lint = "latest"
